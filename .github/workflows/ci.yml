name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest ruff mypy
      - run: ruff check src tools tests
      - run: mypy src
      - run: PYTHONPATH=src:tools python3 -m pytest -q
      # The published site data must hang together: every front-page link
      # resolves, every quoted sentence is in the filing text, counts add up.
      - run: python3 tools/check_site.py
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The shipped agent: citation check, search, fusion. A stub model, no API key.
      - run: node --test tests/js/
      # The search numbers on the eval page must reproduce exactly from the
      # committed index and golden set. No API key: retrieval only.
      - run: node api/_tools/eval.mjs retrieval --check
