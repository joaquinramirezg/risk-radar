name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the forecast check reads the history of forecast.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest ruff mypy
      - run: ruff check src tools tests
      - run: mypy src
      - run: PYTHONPATH=src:tools python3 -m pytest -q
      # The published site data must hang together: every front-page link
      # resolves, every quoted sentence is in the filing text, counts add up.
      - run: python3 tools/check_site.py
      # A frozen forecast is never edited: forecast.json must match its freeze commit.
      - run: PYTHONPATH=src:tools python3 tools/check_forecast.py
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The shipped agent: citation check, search, fusion. A stub model, no API key.
      - run: node --test tests/js/*.test.mjs
      # The search numbers on the eval page must reproduce exactly from the
      # committed index and golden set. No API key: retrieval only.
      # The production server is Linux x64, and its ONNX arithmetic differs
      # slightly from a Mac's, so the published numbers come from this job.
      # ask-retrieval-linux.json is uploaded on every run; the committed copy
      # must match it exactly.
      - run: node api/_tools/eval.mjs retrieval --check || (node api/_tools/eval.mjs retrieval && false)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ask-retrieval-linux
          path: results/ask-retrieval.json
