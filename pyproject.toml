[project]
name = "sec-10k-retrieval-evals"
version = "0.1.0"
description = "A hand-labelled retrieval eval harness over SEC 10-K risk-factor sections."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
# The neural rungs of the baseline ladder (dense, hybrid, rerank). Not needed
# to reproduce the BM25 numbers.
ladder = ["sentence-transformers>=3.0", "numpy>=1.26"]
# The change-type classifier (tools/classify_changes.py). Needs ANTHROPIC_API_KEY.
classify = ["anthropic>=2.8", "pydantic>=2"]

[tool.ruff]
line-length = 100
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# Optional extra for the neural rungs; it ships no type stubs.
module = ["sentence_transformers", "sentence_transformers.*", "numpy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]
