<!doctype html><html lang="en"><head><meta charset="utf-8">
<!-- Link-preview image (site/og.png, 1200x630) and touch icon. Rendered by
     render.js from the built data, so the numbers on the card match the site. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
* { box-sizing: border-box; margin: 0; }
body { width: 1200px; height: 630px; background: #f7f8fa; color: #18202c; font-family: "IBM Plex Sans", sans-serif; }
.card { position: absolute; inset: 0; padding: 64px 72px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 18px; border-top: 14px solid #18202c; }
.eyebrow { font: 500 18px/1 "IBM Plex Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: #4a5566; }
h1 { font: 700 104px/0.95 "IBM Plex Sans Condensed", sans-serif; letter-spacing: -0.02em; }
.sub { font-size: 30px; line-height: 1.3; color: #4a5566; max-width: 36ch; align-self: start; }
.sub .ins { color: #1d4ed8; text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 5px; }
.sub .del { color: #b42318; text-decoration: line-through; text-decoration-thickness: 3px; }
.stats { display: flex; gap: 48px; border-top: 2px solid #18202c; padding-top: 22px; }
.stats div { display: grid; gap: 4px; font-size: 20px; color: #4a5566; }
.stats b { font: 700 46px/1 "IBM Plex Sans Condensed", sans-serif; color: #18202c; }
.mark { position: absolute; right: 72px; top: 76px; width: 150px; height: 150px; }
body.icon { width: 180px; height: 180px; }
</style></head><body>
<div class="card" id="card">
  <span class="eyebrow">SEC 10-K · Item 1A · filing over filing</span>
  <h1>Risk Radar</h1>
  <p class="sub">What the S&amp;P 100 <span class="ins">added</span>, <span class="del">removed</span> and rewrote in the risk factors of their annual reports.</p>
  <div class="stats"><div><b id="co">–</b>companies</div><div><b id="rf">–</b>risk factors compared</div><div><b id="ai">–</b>added language on AI</div></div>
</div>
<svg class="mark" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#18202c"/><rect x="12" y="15" width="40" height="6" rx="2" fill="#e6ebf2"/><rect x="12" y="29" width="30" height="6" rx="2" fill="#8fb0ff"/><rect x="12" y="38" width="30" height="2.5" rx="1" fill="#8fb0ff"/><rect x="12" y="46" width="36" height="6" rx="2" fill="#ff8f85" opacity=".55"/><rect x="9" y="47.75" width="42" height="2.5" rx="1" fill="#ff8f85"/></svg>
<script>
fetch("../../site/data/findings.json").then(r => r.json()).then(f => {
  const ai = f.themes.find(t => t.theme === "Artificial intelligence");
  document.getElementById("co").textContent = f.companies;
  document.getElementById("rf").textContent = f.risks_current.toLocaleString("en-US");
  document.getElementById("ai").textContent = `${ai.companies_up} of ${f.companies}`;
  document.body.dataset.ready = "1";
});
</script>
</body></html>
